# Folder sync configuration.
# The entries below are EXAMPLES only - uncomment and edit them to configure
# real folders or single files for synchronization. Each entry needs a unique
# id, a path and a sync mode (mirror | backup-to-peer | backup-from-peer).

# entries:
#   # Example: sync a whole folder bidirectionally.
#   - id: dokumente
#     path: /home/user/Dokumente
#     mode: mirror
#
#   # Example: one-way backup of a folder to other peers. (Sends backup)
#   - id: notizen
#     path: /home/user/notizen.txt
#     mode: backup-to-peer
#
#   # Example: one-way backup of a folder from other peers. (Receives backup)
#   - id: fotos
#     path: /home/user/Fotos
#     mode: backup-from-peer
