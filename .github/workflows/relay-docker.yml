name: Relay Server - Build & Push Docker Image

on:
  push:
#    branches:
#      - dev
#    paths:
#      - "dsync/network/relay_server.py"
#      - "dsync/network/relay_protocol.py"
#      - "dsync/network/relay_client.py"
#      - "dsync/network/relay_daemon.py"
#      - "dsync/cli/commands/relay/**"
#      - "dsync/**/*.py"
#      - "pyproject.toml"
#      - "Dockerfile.relay"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/vsys-26/dsync-relay
  RELAY_DIR: /opt/dsync-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=dev-
            type=raw,value=dev-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relay
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    name: SSH deploy to test server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: test-relay

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_RELAY_HOST }}
          username: ${{ secrets.TEST_RELAY_USER }}
          key: ${{ secrets.TEST_RELAY_SSH_KEY }}
          script: |
            set -e

            IMAGE="${{ env.IMAGE_NAME }}"
            TAG="dev-latest"
            RELAY_DIR="${{ env.RELAY_DIR }}"

            mkdir -p "$RELAY_DIR"

            # Generate TLS cert+key once. Fingerprint stays stable across redeploys.
            if [ ! -f "$RELAY_DIR/cert.pem" ] || [ ! -f "$RELAY_DIR/key.pem" ]; then
              openssl req -x509 -newkey rsa:2048 \
                -keyout "$RELAY_DIR/key.pem" \
                -out "$RELAY_DIR/cert.pem" \
                -days 3650 -nodes \
                -subj "/CN=dsync-test-relay"
              echo "[deploy] Generated new TLS cert/key."
            fi

            echo "${{ secrets.TEST_RELAY_GHCR_TOKEN }}" \
              | docker login ghcr.io -u "${{ secrets.TEST_RELAY_GHCR_USER }}" --password-stdin

            docker pull "$IMAGE:$TAG"

            docker stop dsync-relay-test 2>/dev/null || true
            docker rm   dsync-relay-test 2>/dev/null || true

            docker run -d \
              --name dsync-relay-test \
              --restart unless-stopped \
              -p 9000:9000/udp \
              -v "$RELAY_DIR/cert.pem:/app/cert.pem:ro" \
              -v "$RELAY_DIR/key.pem:/app/key.pem:ro" \
              "$IMAGE:$TAG" \
              --host 0.0.0.0 --port 9000 \
              --cert /app/cert.pem --key /app/key.pem

            echo ""
            echo "=== Relay fingerprint (share with peers) ==="
            openssl x509 -in "$RELAY_DIR/cert.pem" -pubkey -noout \
              | openssl pkey -pubin -outform DER \
              | openssl dgst -sha256 \
              | awk '{print $2}'
            echo "============================================="
            echo ""

            docker ps --filter name=dsync-relay-test --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
